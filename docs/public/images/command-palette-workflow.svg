<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="kbdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="destGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #1d4ed8; text-transform: uppercase; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255, 255, 255, 0.9); }
    .step-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 600; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="850" height="260" rx="16" fill="url(#bgBoxGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">BeechCMS Command Palette (Cmd+K) Spotlight Workflow</text>

  <!-- Node 1: Keyboard Trigger (Left) -->
  <g transform="translate(38, 70)">
    <rect width="190" height="170" rx="12" fill="url(#kbdGrad)" filter="drop-shadow(0 6px 14px rgba(59, 130, 246, 0.3))"/>
    <rect x="16" y="16" width="94" height="20" rx="5" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="63" y="30" text-anchor="middle" class="card-badge">Global Hotkey</text>
    <text x="16" y="60" class="card-title">⌘ + K / Ctrl + K</text>
    <text x="16" y="82" class="card-desc">• Accessible everywhere</text>
    <text x="16" y="102" class="card-desc">• Keyboard-first workflow</text>
    <text x="16" y="122" class="card-desc">• Zero mouse interaction</text>
    <text x="16" y="142" class="card-desc">• Instant pop-up overlay</text>
  </g>

  <!-- Connector: Hotkey -> Modal UI -->
  <path d="M 228 150 L 298 150" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(230, 130)">
    <rect x="0" y="0" width="65" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="32" y="12" text-anchor="middle" class="step-pill" fill="#1d4ed8">Invokes</text>
  </g>

  <!-- Node 2: Spotlight Modal UI (Center) -->
  <g transform="translate(305, 65)">
    <rect width="270" height="180" rx="12" fill="url(#modalGrad)" filter="drop-shadow(0 6px 16px rgba(15, 23, 42, 0.4))"/>
    <rect x="16" y="14" width="112" height="18" rx="4" fill="rgba(255, 255, 255, 0.18)"/>
    <text x="72" y="27" text-anchor="middle" class="card-badge">Spotlight Modal</text>
    <text x="16" y="48" class="card-title">Command Dialog (cmdk)</text>
    
    <!-- Search Bar Graphic inside modal -->
    <g transform="translate(16, 60)">
      <rect width="238" height="24" rx="5" fill="#334155" stroke="#475569" stroke-width="1"/>
      <text x="10" y="16" fill="#94a3b8" font-size="10.5px" font-family="monospace">🔍 search articles, seeds...</text>
    </g>
    
    <text x="16" y="108" class="card-desc">• Dynamic Breadcrumb Chips</text>
    <text x="16" y="126" class="card-desc">• Fuzzy Seed collection matching</text>
    <text x="16" y="144" class="card-desc">• Deep Fruit record search</text>
    <text x="16" y="162" class="card-desc">• Quick theme toggle &amp; actions</text>
  </g>

  <!-- Connector: Modal -> Destination Execution -->
  <path d="M 575 150 L 645 150" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <g transform="translate(578, 130)">
    <rect x="0" y="0" width="62" height="18" rx="4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
    <text x="31" y="12" text-anchor="middle" class="step-pill" fill="#4338ca">Executes</text>
  </g>

  <!-- Node 3: Immediate Target Execution (Right) -->
  <g transform="translate(655, 70)">
    <rect width="190" height="170" rx="12" fill="url(#destGrad)" filter="drop-shadow(0 6px 14px rgba(99, 102, 241, 0.3))"/>
    <rect x="16" y="16" width="96" height="20" rx="5" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="64" y="30" text-anchor="middle" class="card-badge">Instant Action</text>
    <text x="16" y="60" class="card-title">Destination</text>
    <text x="16" y="82" class="card-desc">• Direct route navigation</text>
    <text x="16" y="102" class="card-desc">• Open Entry Editor modal</text>
    <text x="16" y="122" class="card-desc">• New record wizard</text>
    <text x="16" y="142" class="card-desc">• Instant theme swap</text>
  </g>
</svg>
