<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="seq-arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="seq-arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="seq-arrow-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1"/>
    </marker>
    <marker id="seq-arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="seq-arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #4f46e5; text-transform: uppercase; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: rgba(255, 255, 255, 0.85); }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .msg { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 600; fill: #334155; }
    .msg-ret { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 500; fill: #64748b; }
    .msg-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-style: italic; fill: #475569; }
    .phase { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 600; fill: #475569; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="850" height="570" rx="16" fill="url(#bgBoxGrad)" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">MCP Agent Schema Creation — Inspect → Validate → Plan → Apply</text>

  <!-- Phase bands -->
  <rect x="30" y="140" width="820" height="98" rx="7" fill="#3b82f6" fill-opacity="0.05"/>
  <text x="40" y="154" class="phase" fill="#2563eb">1 · Inspect</text>
  <rect x="30" y="242" width="820" height="50" rx="7" fill="#6366f1" fill-opacity="0.05"/>
  <text x="40" y="256" class="phase" fill="#4f46e5">2 · Validate</text>
  <rect x="30" y="296" width="820" height="98" rx="7" fill="#f59e0b" fill-opacity="0.06"/>
  <text x="40" y="310" class="phase" fill="#b45309">3 · Plan</text>
  <rect x="30" y="428" width="820" height="98" rx="7" fill="#10b981" fill-opacity="0.06"/>
  <text x="40" y="442" class="phase" fill="#047857">4 · Apply</text>

  <!-- Lifelines -->
  <line x1="100" y1="100" x2="100" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="310" y1="100" x2="310" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="540" y1="100" x2="540" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="775" y1="100" x2="775" y2="556" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Participant headers -->
  <g transform="translate(40, 56)">
    <rect width="120" height="44" rx="9" fill="url(#userGrad)" filter="drop-shadow(0 4px 10px rgba(51, 65, 85, 0.3))"/>
    <text x="60" y="19" text-anchor="middle" class="card-badge">Actor</text>
    <text x="60" y="34" text-anchor="middle" class="card-title">User</text>
  </g>
  <g transform="translate(230, 56)">
    <rect width="160" height="44" rx="9" fill="url(#agentGrad)" filter="drop-shadow(0 4px 10px rgba(59, 130, 246, 0.3))"/>
    <text x="80" y="19" text-anchor="middle" class="card-badge">IDE Agent</text>
    <text x="80" y="34" text-anchor="middle" class="card-title">AI Assistant</text>
  </g>
  <g transform="translate(455, 56)">
    <rect width="170" height="44" rx="9" fill="url(#mcpGrad)" filter="drop-shadow(0 4px 10px rgba(99, 102, 241, 0.3))"/>
    <text x="85" y="19" text-anchor="middle" class="card-badge">Stdio JSON-RPC</text>
    <text x="85" y="34" text-anchor="middle" class="card-title">@beechcms/mcp</text>
  </g>
  <g transform="translate(690, 56)">
    <rect width="170" height="44" rx="9" fill="url(#apiGrad)" filter="drop-shadow(0 4px 10px rgba(16, 185, 129, 0.3))"/>
    <text x="85" y="19" text-anchor="middle" class="card-badge">Hono + D1</text>
    <text x="85" y="34" text-anchor="middle" class="card-title">BeechCMS API</text>
  </g>

  <!-- 1. User -> Agent -->
  <text x="205" y="120" text-anchor="middle" class="msg-sans">“Create a products seed…”</text>
  <path d="M 100 126 L 304 126" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#seq-arrow-slate)"/>

  <!-- 2. Agent -> MCP -->
  <text x="425" y="166" text-anchor="middle" class="msg">beech_list_seeds()</text>
  <path d="M 310 172 L 534 172" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#seq-arrow-blue)"/>

  <!-- 3. MCP -> API -->
  <text x="658" y="166" text-anchor="middle" class="msg">GET /api/seeds</text>
  <path d="M 540 172 L 769 172" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#seq-arrow-blue)"/>

  <!-- 4. API --> MCP -->
  <text x="658" y="196" text-anchor="middle" class="msg-ret">X-Schema-Version: 4</text>
  <path d="M 775 202 L 546 202" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-blue)"/>

  <!-- 5. MCP --> Agent -->
  <text x="425" y="226" text-anchor="middle" class="msg-ret">Summaries + version 4</text>
  <path d="M 540 232 L 316 232" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-blue)"/>

  <!-- 6. Agent -> MCP -->
  <text x="425" y="266" text-anchor="middle" class="msg">beech_schema_validate(candidate)</text>
  <path d="M 310 272 L 534 272" fill="none" stroke="#6366f1" stroke-width="1.8" marker-end="url(#seq-arrow-indigo)"/>

  <!-- 7. MCP --> Agent -->
  <text x="425" y="290" text-anchor="middle" class="msg-ret">Validation OK (0 issues)</text>
  <path d="M 540 296 L 316 296" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-indigo)"/>

  <!-- 8. Agent -> MCP -->
  <text x="425" y="322" text-anchor="middle" class="msg">beech_schema_plan(slug, candidate)</text>
  <path d="M 310 328 L 534 328" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#seq-arrow-amber)"/>

  <!-- 9. MCP -> API -->
  <text x="658" y="322" text-anchor="middle" class="msg">POST …/products/mcp-plan</text>
  <path d="M 540 328 L 769 328" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#seq-arrow-amber)"/>

  <!-- 10. API --> MCP -->
  <text x="658" y="352" text-anchor="middle" class="msg-ret">planId · create · v4</text>
  <path d="M 775 358 L 546 358" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-amber)"/>

  <!-- 11. MCP --> Agent -->
  <text x="425" y="382" text-anchor="middle" class="msg-ret">DDL preview + planId</text>
  <path d="M 540 388 L 316 388" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-amber)"/>

  <!-- 12. Agent -> User (confirmation gate) -->
  <text x="205" y="410" text-anchor="middle" class="msg-sans">“CREATE TABLE … Proceed?”</text>
  <path d="M 310 416 L 106 416" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#seq-arrow-slate)"/>

  <!-- 13. User -> Agent -->
  <text x="205" y="446" text-anchor="middle" class="msg-sans">“Yes, apply it.”</text>
  <path d="M 100 452 L 304 452" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#seq-arrow-slate)"/>

  <!-- 14. Agent -> MCP -->
  <text x="425" y="476" text-anchor="middle" class="msg">beech_schema_apply(planId)</text>
  <path d="M 310 482 L 534 482" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#seq-arrow-emerald)"/>

  <!-- 15. MCP -> API -->
  <text x="658" y="476" text-anchor="middle" class="msg">POST …/products/mcp-apply</text>
  <path d="M 540 482 L 769 482" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#seq-arrow-emerald)"/>

  <!-- 16. API --> MCP -->
  <text x="658" y="506" text-anchor="middle" class="msg-ret">applied · newVersion: 5</text>
  <path d="M 775 512 L 546 512" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-emerald)"/>

  <!-- 17. MCP --> Agent -->
  <text x="425" y="536" text-anchor="middle" class="msg-ret">Success (version 5)</text>
  <path d="M 540 542 L 316 542" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#seq-arrow-emerald)"/>

  <!-- Legend -->
  <g transform="translate(36, 566)">
    <line x1="0" y1="-3" x2="22" y2="-3" stroke="#475569" stroke-width="1.8"/>
    <text x="30" y="0" class="legend">request</text>
    <line x1="92" y1="-3" x2="114" y2="-3" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="122" y="0" class="legend">response</text>
    <text x="196" y="0" class="legend" fill="#64748b">Single-use planId · 10 min TTL · OCC guard on seed_meta.registry_version</text>
  </g>
</svg>
