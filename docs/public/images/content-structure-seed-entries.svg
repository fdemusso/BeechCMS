<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="seedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#3F3D56"/>
    </linearGradient>
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Markers / Arrowheads -->
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF6584"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #FF6584; text-transform: uppercase; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255, 255, 255, 0.85); }
    .fruit-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; fill: #bfdbfe; text-transform: uppercase; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="830" height="300" rx="16" fill="url(#bgBoxGrad)" stroke="#FF6584" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">BeechCMS Botanical Hierarchy (Seeds → Fruits &amp; Branches)</text>

  <!-- Node 1: Seed (Left) -->
  <g transform="translate(40, 85)">
    <rect width="215" height="160" rx="12" fill="url(#seedGrad)" filter="drop-shadow(0 6px 16px rgba(5, 150, 105, 0.3))"/>
    <rect x="18" y="16" width="82" height="20" rx="5" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="59" y="30" text-anchor="middle" class="card-badge">Blueprint</text>
    <text x="18" y="62" class="card-title">Seed: Articoli</text>
    <text x="18" y="84" class="card-desc">• Modello di contenuto</text>
    <text x="18" y="104" class="card-desc">• Definisce lo schema</text>
    <text x="18" y="124" class="card-desc">• Configurato dall'Admin</text>
    <text x="18" y="144" class="card-desc">• Single source of truth</text>
  </g>

  <!-- Connector Paths from Seed to 3 Fruits -->
  <path d="M 260 140 C 290 140, 290 85, 320 85" fill="none" stroke="#FF6584" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 260 165 L 320 165" fill="none" stroke="#FF6584" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 260 190 C 290 190, 290 245, 320 245" fill="none" stroke="#FF6584" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Node 2A: Fruit 1 (Middle Top) -->
  <g transform="translate(330, 55)">
    <rect width="235" height="60" rx="10" fill="url(#fruitGrad)" filter="drop-shadow(0 4px 12px rgba(59, 130, 246, 0.25))"/>
    <text x="16" y="24" class="fruit-badge">Fruit 1 (Published)</text>
    <text x="16" y="44" class="card-title">"Summer 2026 Lookbook"</text>
  </g>

  <!-- Node 2B: Fruit 2 (Middle Center) - Focused -->
  <g transform="translate(330, 135)">
    <rect width="235" height="60" rx="10" fill="url(#fruitGrad)" stroke="#93c5fd" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(59, 130, 246, 0.35))"/>
    <text x="16" y="24" class="fruit-badge">Fruit 2 (Draft)</text>
    <text x="16" y="44" class="card-title">"10 Tips for Remote Teams"</text>
  </g>

  <!-- Node 2C: Fruit 3 (Middle Bottom) -->
  <g transform="translate(330, 215)">
    <rect width="235" height="60" rx="10" fill="url(#fruitGrad)" filter="drop-shadow(0 4px 12px rgba(59, 130, 246, 0.25))"/>
    <text x="16" y="24" class="fruit-badge">Fruit 3 (Scheduled)</text>
    <text x="16" y="44" class="card-title">"Product Update v2.4"</text>
  </g>

  <!-- Connector Path from Fruit 2 to Branches Breakdown -->
  <path d="M 570 165 L 615 165" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 3: Branches Anatomy (Right) -->
  <g transform="translate(625, 60)">
    <rect width="205" height="210" rx="12" fill="url(#branchGrad)" filter="drop-shadow(0 6px 16px rgba(99, 102, 241, 0.3))"/>
    <rect x="16" y="16" width="120" height="20" rx="5" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="76" y="30" text-anchor="middle" class="card-badge">Fruit Anatomy</text>
    <text x="16" y="58" class="card-title">Branches (Fields)</text>
    <text x="16" y="82" class="card-desc">• Title (text)</text>
    <text x="16" y="104" class="card-desc">• Author (relation)</text>
    <text x="16" y="126" class="card-desc">• Cover Image (file/R2)</text>
    <text x="16" y="148" class="card-desc">• Body (richtext)</text>
    <text x="16" y="170" class="card-desc">• Status (draft/published)</text>
    <text x="16" y="192" class="card-desc">• Tags (taxonomy)</text>
  </g>
</svg>
