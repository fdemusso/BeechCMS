<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="layeredGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="authSliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="contentSliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#3F3D56"/>
    </linearGradient>
    <linearGradient id="autoSliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF6584" stop-opacity="0.04"/>
    </linearGradient>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #FF6584; text-transform: uppercase; }
    .section-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255, 255, 255, 0.9); }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 500; fill: #64748b; }
    .danger-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; fill: #dc2626; }
    .success-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #FF6584; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="830" height="300" rx="16" fill="url(#bgBoxGrad)" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">Architecture Comparison: Layered vs Vertical Slice</text>

  <!-- LEFT: Layered Architecture (Horizontal) -->
  <g transform="translate(40, 60)">
    <text x="0" y="18" class="section-header">Traditional Layered (Horizontal)</text>
    <text x="0" y="34" class="note-text">Organized by technical role</text>

    <!-- Layer 1: Controllers -->
    <g transform="translate(0, 48)">
      <rect width="320" height="42" rx="8" fill="url(#layeredGrad)"/>
      <text x="16" y="26" class="layer-title">Controllers / Handlers Layer</text>
    </g>

    <!-- Layer 2: Services -->
    <g transform="translate(0, 98)">
      <rect width="320" height="42" rx="8" fill="url(#layeredGrad)"/>
      <text x="16" y="26" class="layer-title">Services / Business Logic Layer</text>
    </g>

    <!-- Layer 3: Repositories -->
    <g transform="translate(0, 148)">
      <rect width="320" height="42" rx="8" fill="url(#layeredGrad)"/>
      <text x="16" y="26" class="layer-title">Repositories / Data Access Layer</text>
    </g>

    <!-- Cross-cutting Coupling Indicator Arrow -->
    <path d="M 285 55 L 285 180" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3 3" marker-end="url(#arrow-red)"/>
    <text x="220" y="210" class="danger-text">1 feature touches 3+ folders</text>
  </g>

  <!-- Divider Line -->
  <line x1="410" y1="65" x2="410" y2="285" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- RIGHT: Vertical Slice Architecture (VSA) -->
  <g transform="translate(440, 60)">
    <text x="0" y="18" class="section-header">Vertical Slice Architecture (VSA)</text>
    <text x="0" y="34" class="success-text">Organized by business domain — self-contained</text>

    <!-- Slice 1: Auth -->
    <g transform="translate(0, 48)">
      <rect width="120" height="150" rx="10" fill="url(#authSliceGrad)" filter="drop-shadow(0 4px 12px rgba(59, 130, 246, 0.25))"/>
      <rect x="10" y="10" width="46" height="16" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
      <text x="33" y="22" text-anchor="middle" class="card-badge">Slice</text>
      <text x="10" y="44" class="card-title">Auth</text>
      <text x="10" y="66" class="card-desc">• Handlers</text>
      <text x="10" y="86" class="card-desc">• Logic</text>
      <text x="10" y="106" class="card-desc">• Types</text>
      <text x="10" y="126" class="card-desc">• Index barrel</text>
    </g>

    <!-- Slice 2: Content -->
    <g transform="translate(130, 48)">
      <rect width="120" height="150" rx="10" fill="url(#contentSliceGrad)" filter="drop-shadow(0 4px 12px rgba(5, 150, 105, 0.25))"/>
      <rect x="10" y="10" width="46" height="16" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
      <text x="33" y="22" text-anchor="middle" class="card-badge">Slice</text>
      <text x="10" y="44" class="card-title">Content</text>
      <text x="10" y="66" class="card-desc">• Handlers</text>
      <text x="10" y="86" class="card-desc">• Engine</text>
      <text x="10" y="106" class="card-desc">• Validation</text>
      <text x="10" y="126" class="card-desc">• Index barrel</text>
    </g>

    <!-- Slice 3: Automations -->
    <g transform="translate(260, 48)">
      <rect width="120" height="150" rx="10" fill="url(#autoSliceGrad)" filter="drop-shadow(0 4px 12px rgba(139, 92, 246, 0.25))"/>
      <rect x="10" y="10" width="46" height="16" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
      <text x="33" y="22" text-anchor="middle" class="card-badge">Slice</text>
      <text x="10" y="44" class="card-title">Automations</text>
      <text x="10" y="66" class="card-desc">• Handlers</text>
      <text x="10" y="86" class="card-desc">• Cron runner</text>
      <text x="10" y="106" class="card-desc">• Executors</text>
      <text x="10" y="126" class="card-desc">• Index barrel</text>
    </g>

    <!-- Isolation Guarantee Text -->
    <text x="0" y="220" class="note-text">Each feature is 100% contained in its own folder.</text>
  </g>
</svg>
