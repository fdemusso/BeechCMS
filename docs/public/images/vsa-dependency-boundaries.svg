<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sliceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="sliceGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#3F3D56"/>
    </linearGradient>
    <linearGradient id="sliceGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FF6584" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-down-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-down-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF6584"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #FF6584; text-transform: uppercase; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255, 255, 255, 0.9); }
    .layer-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; fill: #64748b; text-transform: uppercase; }
    .prohibit-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #dc2626; letter-spacing: 0.4px; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="830" height="350" rx="16" fill="url(#bgBoxGrad)" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">BeechCMS Dependency &amp; Isolation Boundaries</text>

  <!-- LAYER 1: Composition Root -->
  <text x="38" y="70" class="layer-label">1. Composition Root Layer</text>
  <g transform="translate(38, 78)">
    <rect width="784" height="42" rx="8" fill="url(#rootGrad)" filter="drop-shadow(0 4px 10px rgba(15, 23, 42, 0.25))"/>
    <text x="20" y="26" class="card-title">factory.ts &amp; App Shells</text>
    <text x="240" y="26" class="card-desc">• Mounts feature sub-apps via their public index.ts barrel (e.g. /content, /auth)</text>
  </g>

  <!-- Downward Connectors from Root to Features -->
  <path d="M 160 120 L 160 152" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-down-blue)"/>
  <path d="M 430 120 L 430 152" fill="none" stroke="#FF6584" stroke-width="2" marker-end="url(#arrow-down-emerald)"/>
  <path d="M 700 120 L 700 152" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-down-blue)"/>

  <!-- LAYER 2: Feature Slices -->
  <text x="38" y="150" class="layer-label">2. Vertical Features Layer (Zero Cross-Feature Imports)</text>
  <g transform="translate(38, 158)">
    <!-- Slice 1: Auth -->
    <g transform="translate(0, 0)">
      <rect width="235" height="96" rx="10" fill="url(#sliceGrad1)" filter="drop-shadow(0 4px 12px rgba(59, 130, 246, 0.25))"/>
      <rect x="12" y="10" width="80" height="17" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
      <text x="52" y="22" text-anchor="middle" class="card-badge">Feature Slice</text>
      <text x="12" y="46" class="card-title">features/auth/</text>
      <text x="12" y="66" class="card-desc">• handlers/ (login, refresh)</text>
      <text x="12" y="82" class="card-desc">• index.ts, types, constants</text>
    </g>

    <!-- Cross-Import Prohibition Barrier 1-2 -->
    <g transform="translate(242, 36)">
      <line x1="0" y1="12" x2="30" y2="12" stroke="#dc2626" stroke-width="2" stroke-dasharray="2 2"/>
      <circle cx="15" cy="12" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="15" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✕</text>
      <text x="15" y="32" text-anchor="middle" class="prohibit-label">NO CROSS</text>
    </g>

    <!-- Slice 2: Content -->
    <g transform="translate(275, 0)">
      <rect width="235" height="96" rx="10" fill="url(#sliceGrad2)" filter="drop-shadow(0 4px 12px rgba(5, 150, 105, 0.25))"/>
      <rect x="12" y="10" width="80" height="17" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
      <text x="52" y="22" text-anchor="middle" class="card-badge">Feature Slice</text>
      <text x="12" y="46" class="card-title">features/content/</text>
      <text x="12" y="66" class="card-desc">• handlers/ (CRUD, search)</text>
      <text x="12" y="82" class="card-desc">• index.ts, types, constants</text>
    </g>

    <!-- Cross-Import Prohibition Barrier 2-3 -->
    <g transform="translate(517, 36)">
      <line x1="0" y1="12" x2="30" y2="12" stroke="#dc2626" stroke-width="2" stroke-dasharray="2 2"/>
      <circle cx="15" cy="12" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
      <text x="15" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">✕</text>
      <text x="15" y="32" text-anchor="middle" class="prohibit-label">NO CROSS</text>
    </g>

    <!-- Slice 3: Automations -->
    <g transform="translate(549, 0)">
      <rect width="235" height="96" rx="10" fill="url(#sliceGrad3)" filter="drop-shadow(0 4px 12px rgba(139, 92, 246, 0.25))"/>
      <rect x="12" y="10" width="80" height="17" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
      <text x="52" y="22" text-anchor="middle" class="card-badge">Feature Slice</text>
      <text x="12" y="46" class="card-title">features/automations/</text>
      <text x="12" y="66" class="card-desc">• handlers/ &amp; action-executors/</text>
      <text x="12" y="82" class="card-desc">• cron-runner, index.ts</text>
    </g>
  </g>

  <!-- Downward Connectors from Features to Shared/Core -->
  <path d="M 160 254 L 160 286" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-down-blue)"/>
  <path d="M 430 254 L 430 286" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-down-blue)"/>
  <path d="M 700 254 L 700 286" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-down-blue)"/>

  <!-- LAYER 3: Shared Core & Infrastructure -->
  <text x="38" y="284" class="layer-label">3. Shared Core &amp; Infrastructure Layer</text>
  <g transform="translate(38, 292)">
    <rect width="784" height="48" rx="8" fill="url(#coreGrad)" filter="drop-shadow(0 4px 10px rgba(2, 132, 199, 0.25))"/>
    <text x="20" y="22" class="card-title">packages/core (Contracts &amp; Engine) &amp; apps/api/src/shared/ (D1 Repositories)</text>
    <text x="20" y="38" class="card-desc">• Pure interfaces (IContentRepository), Botanical Engine, D1 implementations injected via middleware</text>
  </g>
</svg>
