<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="triggerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="schedulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="100%" stop-color="#3F3D56"/>
    </linearGradient>
    <linearGradient id="notifGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF6584"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #6366f1; text-transform: uppercase; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255, 255, 255, 0.9); }
    .action-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 600; fill: #1e293b; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="830" height="300" rx="16" fill="url(#bgBoxGrad)" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">BeechCMS Observability &amp; Notifications Pipeline</text>

  <!-- Node 1: Event Trigger (Left) -->
  <g transform="translate(38, 75)">
    <rect width="200" height="190" rx="12" fill="url(#triggerGrad)" filter="drop-shadow(0 6px 16px rgba(59, 130, 246, 0.3))"/>
    <rect x="14" y="14" width="105" height="19" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="66" y="27" text-anchor="middle" class="card-badge">System Trigger</text>
    <text x="14" y="55" class="card-title">Events &amp; Writes</text>
    <text x="14" y="78" class="card-desc">• Content CRUD actions</text>
    <text x="14" y="98" class="card-desc">• Public API submissions</text>
    <text x="14" y="118" class="card-desc">• User login &amp; auth</text>
    <text x="14" y="138" class="card-desc">• Scheduled cron triggers</text>
    <text x="14" y="158" class="card-desc">• Custom route events</text>
  </g>

  <!-- Connector Path: Trigger -> Scheduler -->
  <path d="M 238 170 L 305 170" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(242, 145)">
    <rect x="0" y="0" width="60" height="18" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
    <text x="30" y="12" text-anchor="middle" class="action-pill" fill="#1d4ed8">Dispatch</text>
  </g>

  <!-- Node 2: Edge Scheduler (Center) -->
  <g transform="translate(315, 95)">
    <rect width="210" height="150" rx="12" fill="url(#schedulerGrad)" filter="drop-shadow(0 6px 16px rgba(15, 23, 42, 0.25))"/>
    <rect x="14" y="14" width="100" height="19" rx="4" fill="rgba(255, 255, 255, 0.15)"/>
    <text x="64" y="27" text-anchor="middle" class="card-badge">Edge Worker</text>
    <text x="14" y="55" class="card-title">IScheduler</text>
    <text x="14" y="78" class="card-desc">• Non-blocking execution</text>
    <text x="14" y="98" class="card-desc">• waitUntil(promise)</text>
    <text x="14" y="118" class="card-desc">• Zero latency added to HTTP</text>
    <text x="14" y="138" class="card-desc">• Resilient fire-and-forget</text>
  </g>

  <!-- Connector Path: Scheduler -> Activity Logger (Top Right) -->
  <path d="M 525 140 C 560 140, 560 105, 595 105" fill="none" stroke="#FF6584" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Connector Path: Scheduler -> Notification Service (Bottom Right) -->
  <path d="M 525 200 C 560 200, 560 235, 595 235" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Node 3: Activity Logger (Right Top) -->
  <g transform="translate(605, 60)">
    <rect width="220" height="95" rx="10" fill="url(#auditGrad)" filter="drop-shadow(0 4px 12px rgba(5, 150, 105, 0.25))"/>
    <rect x="12" y="10" width="100" height="17" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="62" y="22" text-anchor="middle" class="card-badge">IActivityLogger</text>
    <text x="12" y="44" class="card-title">content_event_log</text>
    <text x="12" y="62" class="card-desc">• Full audit trail &amp; actor tracking</text>
    <text x="12" y="78" class="card-desc">• Feeds Dashboard Activity widgets</text>
  </g>

  <!-- Node 4: Notification Service (Right Bottom) -->
  <g transform="translate(605, 175)">
    <rect width="220" height="105" rx="10" fill="url(#notifGrad)" filter="drop-shadow(0 4px 12px rgba(139, 92, 246, 0.25))"/>
    <rect x="12" y="10" width="125" height="17" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="74" y="22" text-anchor="middle" class="card-badge">INotificationService</text>
    <text x="12" y="44" class="card-title">Dashboard Inbox &amp; QStash</text>
    <text x="12" y="62" class="card-desc">• Header bell notifications popover</text>
    <text x="12" y="78" class="card-desc">• Read/unread badge states</text>
    <text x="12" y="94" class="card-desc">• Background alerts &amp; external hooks</text>
  </g>
</svg>
