<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="callerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="resendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="customGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="bgBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Markers / Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6366f1"/>
    </marker>
  </defs>

  <style>
    .diagram-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; fill: #059669; text-transform: uppercase; }
    .card-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; fill: #ffffff; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: rgba(255, 255, 255, 0.85); }
    .code-pill { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 600; fill: #1d4ed8; }
  </style>

  <!-- Container Box -->
  <rect x="15" y="15" width="830" height="260" rx="16" fill="url(#bgBoxGrad)" stroke="#059669" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="36" y="42" class="diagram-title">BeechCMS Email Delivery Pipeline</text>

  <!-- Node 1: Caller / Trigger (Left) -->
  <g transform="translate(38, 70)">
    <rect width="210" height="165" rx="12" fill="url(#callerGrad)" filter="drop-shadow(0 6px 16px rgba(59, 130, 246, 0.3))"/>
    <rect x="16" y="16" width="94" height="20" rx="5" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="63" y="30" text-anchor="middle" class="card-badge">Caller Event</text>
    <text x="16" y="60" class="card-title">Action / Trigger</text>
    <text x="16" y="82" class="card-desc">• Password Reset Request</text>
    <text x="16" y="102" class="card-desc">• Password Changed Alert</text>
    <text x="16" y="122" class="card-desc">• Automation: send_mail</text>
    <text x="16" y="142" class="card-desc">• Passes recipient &amp; locale</text>
  </g>

  <!-- Connector Path 1: Caller -> email.service.ts -->
  <path d="M 248 152 L 318 152" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  
  <!-- Centered Request Label Badge -->
  <g transform="translate(249, 143)">
    <rect x="0" y="-12" width="68" height="18" rx="4" fill="#f8fafc" stroke="#3b82f6" stroke-width="1"/>
    <text x="34" y="0" text-anchor="middle" class="code-pill">sendEmail()</text>
  </g>

  <!-- Node 2: email.service.ts (Center) -->
  <g transform="translate(325, 70)">
    <rect width="240" height="165" rx="12" fill="url(#serviceGrad)" filter="drop-shadow(0 6px 16px rgba(5, 150, 105, 0.3))"/>
    <rect x="16" y="16" width="102" height="20" rx="5" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="67" y="30" text-anchor="middle" class="card-badge">Orchestrator</text>
    <text x="16" y="60" class="card-title">email.service.ts</text>
    <text x="16" y="82" class="card-desc">• resolveEmailLocale(locale)</text>
    <text x="16" y="102" class="card-desc">• COPY[locale] + shell.ts</text>
    <text x="16" y="122" class="card-desc">• HTML template composition</text>
    <text x="16" y="142" class="card-desc">• createProvider(apiKey)</text>
  </g>

  <!-- Split Connector Paths to Providers -->
  <path d="M 565 130 C 595 130, 595 110, 620 110" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <path d="M 565 175 C 595 175, 595 195, 620 195" fill="none" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-indigo)"/>

  <!-- Node 3A: Resend Provider (Right Top) -->
  <g transform="translate(630, 68)">
    <rect width="195" height="74" rx="10" fill="url(#resendGrad)" filter="drop-shadow(0 4px 12px rgba(15, 23, 42, 0.35))"/>
    <rect x="14" y="12" width="128" height="19" rx="4" fill="rgba(255, 255, 255, 0.15)"/>
    <text x="78" y="25" text-anchor="middle" class="card-badge">Default Transport</text>
    <text x="14" y="48" class="card-title">Resend API</text>
    <text x="14" y="64" class="card-desc">POST /emails (Zero Latency)</text>
  </g>

  <!-- Node 3B: Custom Transport (Right Bottom) -->
  <g transform="translate(630, 160)">
    <rect width="195" height="74" rx="10" fill="url(#customGrad)" filter="drop-shadow(0 4px 12px rgba(99, 102, 241, 0.25))"/>
    <rect x="14" y="12" width="80" height="19" rx="4" fill="rgba(0, 0, 0, 0.25)"/>
    <text x="54" y="25" text-anchor="middle" class="card-badge">Extensible</text>
    <text x="14" y="48" class="card-title">Custom Provider</text>
    <text x="14" y="64" class="card-desc">SMTP / SendGrid / Postmark</text>
  </g>
</svg>
