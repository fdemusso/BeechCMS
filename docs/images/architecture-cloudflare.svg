<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%" height="100%">
  <defs>
    <linearGradient id="cfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6821f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#faad3f" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="d1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="r2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-bi" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; fill: #f6821f; text-transform: uppercase; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: rgba(255, 255, 255, 0.85); }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
  </style>

  <!-- Container Box (Cloudflare Edge) -->
  <rect x="20" y="20" width="800" height="240" rx="16" fill="url(#cfGrad)" stroke="#f6821f" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="44" y="50" class="title">Cloudflare Global Edge Network</text>

  <!-- Node 1: Workers -->
  <g transform="translate(50, 85)">
    <rect width="230" height="135" rx="12" fill="url(#workerGrad)" filter="drop-shadow(0 4px 12px rgba(59, 130, 246, 0.25))"/>
    <text x="20" y="42" class="card-title">Cloudflare Workers</text>
    <text x="20" y="68" class="card-sub">• Hono REST API Engine</text>
    <text x="20" y="90" class="card-sub">• /admin React SPA Assets</text>
    <text x="20" y="112" class="card-sub">• 0ms Cold Starts (Edge)</text>
  </g>

  <!-- Arrow: Workers <-> D1 -->
  <path d="M 290 120 L 530 120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow-bi)"/>
  <text x="410" y="110" text-anchor="middle" class="label">SQL Queries / Schema Sync</text>

  <!-- Arrow: Workers -> R2 -->
  <path d="M 290 185 L 530 185" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="175" text-anchor="middle" class="label">Media Uploads / Streaming</text>

  <!-- Node 2: D1 -->
  <g transform="translate(540, 75)">
    <rect width="250" height="70" rx="10" fill="url(#d1Grad)" filter="drop-shadow(0 4px 12px rgba(16, 185, 129, 0.25))"/>
    <text x="20" y="32" class="card-title">Cloudflare D1 (SQLite)</text>
    <text x="20" y="52" class="card-sub">Content Tables, FTS5 &amp; Relations</text>
  </g>

  <!-- Node 3: R2 -->
  <g transform="translate(540, 160)">
    <rect width="250" height="70" rx="10" fill="url(#r2Grad)" filter="drop-shadow(0 4px 12px rgba(139, 92, 246, 0.25))"/>
    <text x="20" y="32" class="card-title">Cloudflare R2 Storage</text>
    <text x="20" y="52" class="card-sub">Zero-Egress Object / Media Bucket</text>
  </g>
</svg>
