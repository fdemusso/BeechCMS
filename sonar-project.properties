# Obbligatori: Identificativi del progetto
sonar.organization=fdemusso
sonar.projectKey=fdemusso_BeechCMS

# Dove si trova il codice da analizzare
sonar.sources=apps/api/src, apps/dashboard/src

# Cosa NON analizzare come codice sorgente (per evitare falsi positivi e metriche sballate)
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/migrations/**, **/*.test.ts, **/*.spec.ts, **/*.test.tsx, **/*.spec.tsx, **/test/**

# Identificazione esplicita dei test (verranno analizzati con regole specifiche per i test)
sonar.tests=apps/api/test, apps/api/src, apps/dashboard/src
sonar.test.inclusions=**/*.test.ts, **/*.spec.ts, **/*.test.tsx, **/*.spec.tsx, **/test/**


# Opzionale ma utile: Specifica la codifica
sonar.sourceEncoding=UTF-8

# Esclusioni specifiche per la Coverage (devono matchare vitest.config.ts)
sonar.coverage.exclusions=apps/api/src/shared/fts-sync.ts, \
  apps/api/src/shared/fixed-clock.ts, \
  apps/api/src/shared/sequential-id-generator.ts, \
  apps/api/src/shared/in-memory-activity-logger.ts, \
  apps/api/src/shared/in-memory-notification-service.ts, \
  apps/api/src/index.ts, \
  apps/api/src/search.ts, \
  apps/api/src/widget.ts, \
  apps/api/src/features/setup/**, \
  apps/api/src/features/email/**, \
  apps/api/src/features/password-reset/**, \
  apps/api/src/features/notifications/notifications.handler.ts, \
  apps/api/src/features/stats/stats.handler.ts, \
  apps/api/src/features/rotate-field/rotate-field.handler.ts, \
  apps/api/src/shared/storage/**, \
  apps/api/src/features/schema/schema.handler.ts