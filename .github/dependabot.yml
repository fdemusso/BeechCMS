version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    # Few PRs, few releases: version updates are one monthly batch, security updates are one batch
    # as soon as they exist. Every merged batch ends in a patch release of the packages it touches.
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # A brand-new release is the likeliest to be yanked or compromised: wait three days before
    # proposing it. Security updates ignore the cooldown.
    cooldown:
      default-days: 3
    ignore:
      # Workspace packages are versioned by scripts/release.mjs, never by Dependabot.
      - dependency-name: "@beechcms/*"
      # apps/api tests run on @cloudflare/vitest-pool-workers, whose peer range is vitest ^4.1 (still
      # true at 0.23.0). The rest of the workspace is on vitest 5, and a grouped update would apply
      # one target to every manifest and downgrade them. Drop these once pool-workers supports vitest 5 (tracked in #829).
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      # A major bump is a migration, not maintenance: do it on purpose. This only silences routine
      # version updates; a security update that needs a major still opens a PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Everything routine in one PR.
      routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Every security fix in one PR instead of one PR per package and directory.
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
