name: 'Beech Docker Stack'
description: 'Starts MinIO + Mailpit + webhook-tester for integration tests (mirrors docker-compose.yml)'
runs:
  using: composite
  steps:
    # minio/minio and minio/mc were deleted from Docker Hub on 2026-09-11 (MinIO discontinued
    # free Docker Hub images) and quay.io/minio/* now 401s too. bitnamilegacy/minio is the
    # community-verified working mirror; see docker/docker-compose.yml for details. Its
    # entrypoint creates MINIO_DEFAULT_BUCKETS synchronously before the server starts serving,
    # so the separate mc-based bucket-creation step is no longer needed.
    - name: Start MinIO
      shell: bash
      run: |
        docker run -d --name beech-minio -p 9000:9000 -p 9001:9001 \
          -e MINIO_ROOT_USER=beechdev -e MINIO_ROOT_PASSWORD=beechdevsecret \
          -e MINIO_DEFAULT_BUCKETS=beech-media-test-ci:download \
          bitnamilegacy/minio:2025.7.23-debian-12-r5
        for i in {1..20}; do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done

    - name: Start Mailpit
      shell: bash
      run: |
        docker run -d --name beech-mailpit -p 1025:1025 -p 8025:8025 \
          -e MP_SMTP_AUTH_ACCEPT_ANY=1 -e MP_SMTP_AUTH_ALLOW_INSECURE=1 \
          axllent/mailpit:latest
        for i in {1..20}; do curl -sf http://localhost:8025/livez && break; sleep 1; done

    - name: Start webhook-tester
      shell: bash
      run: |
        docker run -d --name beech-webhook-tester -p 8084:8080 \
          tarampampam/webhook-tester:latest
        for i in {1..20}; do curl -sf http://localhost:8084/ready && break; sleep 1; done
