name: Knip

on:
  push:
    branches: [master, devs]
  pull_request:
    branches: [master, devs]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dead-code:
    name: Dead code (files and dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Workspace packages resolve through their built output, so build first like the test jobs do.
      - name: Build packages
        run: pnpm build
      - name: Find unused files and dependencies
        run: pnpm knip:ci
