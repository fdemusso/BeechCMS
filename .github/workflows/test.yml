name: Test

on:
  push:
    branches: [master, devs]
  pull_request:
    branches: [master, devs]

jobs:
  test:
    name: Suite BeechCMS (Deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (Core)
        run: npm run build -w @beechcms/core

      - name: Run Deterministic Flow Tests
        run: npm test -w @beechcms/api