name: Test

on:
  push:
    branches: [master, devs]
  pull_request:
    branches: [master, devs]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run test

      - name: SonarCloud Scan
        uses: antonioaversa/sonarcloud-github-action@v4.0.0
