name: SonarCloud Scan

on:
  push:
    branches: [master, devs]
  pull_request:
    branches: [master, devs]

jobs:
  sonarcloud:
    name: Analisi Qualità del Codice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          # Disabilita i cloni superficiali: SonarCloud deve leggere tutta la storia per funzionare bene
          fetch-depth: 0 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build packages (Core)
        run: npm run build -w @beechcms/core

      - name: Start Docker Stack
        uses: ./.github/actions/docker-stack

      - name: Run Tests with Coverage
        continue-on-error: true
        env:
          BEECH_TEST_BUCKET: beech-media-test-ci
          R2_ENDPOINT: http://localhost:9000
          R2_ACCESS_KEY_ID: beechdev
          R2_SECRET_ACCESS_KEY: beechdevsecret
          R2_BUCKET_NAME: beech-media-test-ci
          EMAIL_PROVIDER: smtp
          SMTP_HOST: localhost
          SMTP_PORT: '8025'
          WEBHOOK_TESTER_URL: http://localhost:8084
        run: npm run test:coverage

      - name: Esegui SonarCloud Scan Ufficiale
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          # SonarScanner CLI arguments
          args: >
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/migrations/**,**/test/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
            -Dsonar.test.exclusions=**/test/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
            -Dsonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/dashboard/coverage/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
