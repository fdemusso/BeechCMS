name: Generate & Verify Documentation

# On pushes to master (and manually) it regenerates docs/api and warns if the committed copy is stale. On pull requests it
# only generates and builds, so a broken docs build is seen before the merge; nothing is committed either way.
on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'typedoc.json'
      - 'docs/**'
      - '.github/workflows/generate-docs.yml'
  pull_request:
    branches: [master, devs]
    paths:
      - 'packages/**'
      - 'typedoc.json'
      - 'docs/**'
      - '.github/workflows/generate-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-generate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-docs:
    name: Generate & Verify Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API Docs (TypeDoc)
        run: pnpm run docs:generate

      - name: Build VitePress Documentation
        run: pnpm exec vitepress build docs

      # master is protected (PR + signed commits + required checks), so the bot cannot push docs/api.
      # Deploy Docs regenerates docs/api at build time; here we only fail on a stale committed snapshot.
      - name: Check committed API docs are current
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain docs/api)" ]; then
            echo "::warning::docs/api is out of date. Run 'pnpm run docs:generate' and commit it."
            git status --short docs/api | head -20
          fi
