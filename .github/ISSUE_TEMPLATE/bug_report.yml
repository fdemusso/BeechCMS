name: 🐛 Bug Report
description: Segnala un problema riscontrato in BeechCMS
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Grazie per aver segnalato un bug!
        Prima di aprire una issue, assicurati di aver letto la [documentazione](https://github.com/fdemusso/BeechCMS#readme) e di aver cercato tra le [issue esistenti](https://github.com/fdemusso/BeechCMS/issues) per evitare duplicati.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: ✅ Prerequisiti
      description: Verifica questi punti prima di procedere
      options:
        - label: Ho cercato tra le issue esistenti e questo bug non è già stato segnalato
          required: true
        - label: Ho letto la documentazione
          required: true
        - label: "**Il bug è riproducibile sull'ultima versione npm del pacchetto oppure sul branch `master`**"
          required: true

  - type: dropdown
    id: version_type
    attributes:
      label: 📦 Dove si verifica il bug?
      description: Specifica se il bug si verifica sulla versione npm o sul branch master
      options:
        - "Versione npm (stabile)"
        - "Branch master (development)"
        - "Entrambi"
    validations:
      required: true

  - type: input
    id: npm_version
    attributes:
      label: 🔖 Versione npm (se applicabile)
      description: Inserisci il numero di versione esatto del pacchetto npm (es. `1.2.3`). Puoi verificarlo con `npm list beech-cms` o nel tuo `package.json`.
      placeholder: es. 1.2.3
    validations:
      required: false

  - type: input
    id: commit_sha
    attributes:
      label: 🔀 Commit SHA su master (se applicabile)
      description: Se stai usando il branch master, inserisci il commit SHA attuale (puoi trovarlo con `git rev-parse HEAD`).
      placeholder: es. a1b2c3d
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 📝 Descrizione del bug
      description: Una descrizione chiara e concisa del problema riscontrato.
      placeholder: Quando faccio X, accade Y invece di Z...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 🔁 Passi per riprodurre
      description: Elenca i passaggi precisi per riprodurre il bug.
      placeholder: |
        1. Configurare il campo di tipo '...'
        2. Inviare una richiesta a '...'
        3. Osservare l'errore
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: ✅ Comportamento atteso
      description: Cosa ti aspettavi che accadesse?
      placeholder: Mi aspettavo che...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: ❌ Comportamento effettivo
      description: Cosa è successo invece?
      placeholder: Invece è successo che...
    validations:
      required: true

  - type: textarea
    id: minimal_reproduction
    attributes:
      label: 🧪 Esempio minimo di riproduzione
      description: Incolla un frammento di codice o la configurazione minima che riproduce il bug. Più è ridotto, prima può essere risolto.
      render: typescript
      placeholder: |
        // Esempio di schema o chiamata API che causa il bug
        const schema = { ... }
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 📋 Log / Stack trace
      description: Incolla qui eventuali messaggi di errore, stack trace o log rilevanti.
      render: shell
      placeholder: Incolla qui l'output dell'errore...
    validations:
      required: false

  - type: dropdown
    id: environment_runtime
    attributes:
      label: 🌐 Runtime / Ambiente
      description: In quale ambiente si verifica il bug?
      options:
        - "Cloudflare Workers"
        - "Cloudflare Pages"
        - "Node.js (sviluppo locale)"
        - "Altro (specifica nelle note aggiuntive)"
    validations:
      required: true

  - type: textarea
    id: environment_details
    attributes:
      label: 🖥️ Dettagli ambiente
      description: Fornisci informazioni aggiuntive sull'ambiente di esecuzione.
      placeholder: |
        - Node.js: v20.x
        - OS: macOS 14 / Ubuntu 22.04 / Windows 11
        - Wrangler: v3.x (se applicabile)
        - Package manager: npm / pnpm / yarn
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Gravità
      description: Quanto è critico questo bug per il tuo utilizzo?
      options:
        - "🔴 Critico — blocca completamente l'utilizzo"
        - "🟠 Alto — funzionalità importante non funziona"
        - "🟡 Medio — funzionalità degradata ma c'è un workaround"
        - "🟢 Basso — problema estetico o minore"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 💬 Contesto aggiuntivo
      description: Qualsiasi altra informazione che possa essere utile (screenshot, link a risorse, workaround trovati, ecc.).
    validations:
      required: false
