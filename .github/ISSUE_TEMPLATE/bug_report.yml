name: 🐛 Bug Report
description: Report a bug in BeechCMS
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Thanks for reporting a bug!
        Before opening an issue, please make sure you have read the [documentation](https://github.com/fdemusso/BeechCMS#readme) and searched through the [existing issues](https://github.com/fdemusso/BeechCMS/issues) to avoid duplicates.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: ✅ Prerequisites
      description: Please confirm the following before submitting
      options:
        - label: I searched the existing issues and this bug has not already been reported
          required: true
        - label: I read the documentation
          required: true
        - label: "**The bug is reproducible on the latest npm package version or on the `master` branch**"
          required: true

  - type: dropdown
    id: version_type
    attributes:
      label: 📦 Where does the bug occur?
      description: Specify whether the bug happens on the npm release or on the master branch
      options:
        - "npm package version (stable)"
        - "master branch (development)"
        - "Both"
    validations:
      required: true

  - type: input
    id: npm_version
    attributes:
      label: 🔖 npm package version (if applicable)
      description: Enter the exact npm package version (for example `1.2.3`). You can verify it with `npm list beech-cms` or in your `package.json`.
      placeholder: e.g. 1.2.3
    validations:
      required: false

  - type: input
    id: commit_sha
    attributes:
      label: 🔀 Commit SHA on master (if applicable)
      description: If you are testing against the master branch, provide the current commit SHA (you can get it with `git rev-parse HEAD`).
      placeholder: e.g. a1b2c3d
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 📝 Bug description
      description: Provide a clear and concise description of the issue.
      placeholder: When I do X, Y happens instead of Z...
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: 🔁 Steps to reproduce
      description: List the exact steps required to reproduce the bug.
      placeholder: |
        1. Configure a field of type '...'
        2. Send a request to '...'
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: ✅ Expected behavior
      description: What did you expect to happen?
      placeholder: I expected that...
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: ❌ Actual behavior
      description: What happened instead?
      placeholder: Instead, this happened...
    validations:
      required: true

  - type: textarea
    id: minimal_reproduction
    attributes:
      label: 🧪 Minimal reproduction example
      description: Paste a minimal code snippet or configuration that reproduces the bug. The smaller it is, the faster it can be diagnosed.
      render: typescript
      placeholder: |
        // Minimal schema or API call that triggers the bug
        const schema = { ... }
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 📋 Logs / stack trace
      description: Paste any relevant error messages, stack traces, or logs here.
      render: shell
      placeholder: Paste the error output here...
    validations:
      required: false

  - type: dropdown
    id: environment_runtime
    attributes:
      label: 🌐 Runtime / environment
      description: In which environment does the bug occur?
      options:
        - "Cloudflare Workers"
        - "Cloudflare Pages"
        - "Node.js (local development)"
        - "Other (describe in additional context)"
    validations:
      required: true

  - type: textarea
    id: environment_details
    attributes:
      label: 🖥️ Environment details
      description: Provide any additional runtime or system details.
      placeholder: |
        - Node.js: v20.x
        - OS: macOS 14 / Ubuntu 22.04 / Windows 11
        - Wrangler: v3.x (if applicable)
        - Package manager: npm / pnpm / yarn
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity
      description: How critical is this bug for your use case?
      options:
        - "🔴 Critical — completely blocks usage"
        - "🟠 High — an important feature is broken"
        - "🟡 Medium — degraded behavior but a workaround exists"
        - "🟢 Low — cosmetic or minor issue"
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 💬 Additional context
      description: Add anything else that may help (screenshots, links, workarounds, related notes, and so on).
    validations:
      required: false
